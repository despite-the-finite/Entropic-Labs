<title>Butterfly Trails — Entropic Labs</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Butterfly Trails at Entropic Labs — an interactive family archive. Small moments, different choices, entirely different lives. Stories coming soon.">
<link rel="stylesheet" href="butterfly/butterfly.css">
<!--
  Butterfly Trails is one responsive page, not a desktop page with an m/ twin,
  for the same reason the Observatory is: it is a canvas world whose layout is
  computed at runtime from the viewport and the pointer type, and a second copy
  would only ever drift. Both the full site and m/ link straight here, and
  because this page carries no redirect script it is safe to enter from either.
-->

<canvas id="trails" aria-hidden="true"></canvas>

<!-- The second lens. Empty here: atlas.js paints the country, places the
     waypoints and writes the names inside this element, and only while it is
     the lens actually being looked through. -->
<div class="atlas" id="atlas" tabindex="0" role="group"
     aria-label="A trail map of one life. Drag to move the map, scroll or pinch to zoom, arrow keys to pan, plus and minus to zoom, zero to see the whole country."
     hidden></div>

<div class="haze" aria-hidden="true"></div>

<nav class="bt-nav">
  <a class="brand" href="index.html">ENTROPIC<span>·</span>LABS</a>
  <ul class="navlinks">
    <li><a href="studio.html">Studio</a></li>

  </ul>
</nav>

<!-- ===================================================== THE WAY IN ===== -->
<div class="gate" id="gate" hidden>
  <div class="gate-inner">
    <p class="gate-eyebrow">Entropic Labs</p>
    <h1 class="gate-title">Butterfly Trails</h1>
    <p class="gate-tagline">Small moments. Different choices. Entirely different lives.</p>
    <p class="gate-line" id="gate-line" aria-live="polite"></p>
    <!-- The way in is also the first choice. Both doors open the same
         archive; they differ only in how it is drawn, and either can be
         changed from inside. The doors themselves are built from LENSES,
         so a third lens gets a third door without anything here changing. -->
    <div class="gate-actions">
      <p class="gate-choose" id="gate-choose" hidden></p>
      <div class="gate-doors" id="gate-doors" role="group"
           aria-label="Choose how the archive is drawn"></div>
      <!-- The room's own premise, asked at the door rather than carried
           around inside. It goes in with you and opens on arrival. -->
      <button class="gate-essay" id="gate-essay" type="button" hidden></button>
    </div>
  </div>
  <p class="gate-mark" id="gate-mark"></p>
  <button class="gate-skip" id="gate-skip" type="button">Skip intro</button>
</div>

<!-- ======================================================== THE ROOM ===== -->
<!-- Inside the room the plate says the name of the place and how to move
     around it, and nothing else. The tagline and the essay are both asked at
     the door now: they are the way in, and repeating them over the archive
     was two lines of furniture between the visitor and the memories. -->
<div class="plate" id="plate">
  <h1>Butterfly Trails</h1>
  <p class="hint" id="plate-hint"></p>
</div>

<div class="readout" aria-hidden="true">
  <div class="counts" id="counts"></div>
  <div class="whisper" id="whisper"></div>
</div>

<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<!-- the empty state: a plate, not a hole. A disclosure, because on a phone the
     note and the trail cannot both have the whole screen. -->
<details class="beginning" id="beginning" hidden></details>

<!-- follow a butterfly -->
<div class="dock" id="dock">
  <div class="dock-cats" id="dock-cats" role="group" aria-label="Follow a butterfly"></div>
  <div class="dock-tools">
    <button class="bt-btn" id="index-btn" type="button"
            aria-expanded="false" aria-controls="keynav">
      All memories
    </button>
    <button class="bt-btn surprise" id="surprise" type="button">
      <span class="mark" aria-hidden="true"></span> Surprise me
    </button>
  </div>
</div>

<!-- Two controls, one bar on a phone and two stacked on a wide screen.
     The lens is which experience you are having; the view is a layout
     inside the trails lens, so it goes away when the mountain is up. -->
<div class="viewbar" id="viewbar">
  <div class="lenses" id="lenses" role="group" aria-label="Visual experience"></div>
  <div class="views" id="views" role="group" aria-label="View">
    <button type="button" data-view="trail" aria-pressed="true">Trail</button>
    <button type="button" data-view="constellation" aria-pressed="false" title="See the whole trail">Whole trail</button>
    <button type="button" data-view="map" aria-pressed="false" title="See where it happened">Places</button>
  </div>
</div>

<!-- Who and when. One scrolling strip on a phone; two rails, one at each
     edge, on a wide screen. -->
<div class="rails" id="rails">
  <div class="folk" id="folk" role="group" aria-label="Follow a person" hidden></div>
  <div class="eras" id="eras" role="group" aria-label="Time" hidden></div>
</div>

<!-- one memory -->
<article class="panel story" id="story" role="region" aria-label="A memory" hidden></article>

<!-- the room explaining its own premise -->
<article class="panel essay" id="essay" role="region" aria-label="The butterfly effect" hidden></article>

<!-- a photograph, held up to the light -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph" hidden></div>

<!-- The index. A memory on the trail is a dot until you touch it, which is
     the right way round for exploring and the wrong way round for finding
     something specific — so the same list that serves the keyboard is also
     openable by anybody. -->
<nav class="keynav" id="keynav" aria-label="Butterfly Trails index"></nav>

<noscript>
  <div class="panel story static-fallback">
    <div class="story-inner">
      <h2 class="st-title">Butterfly Trails</h2>
      <p class="st-hook">Small moments. Different choices. Entirely different lives.</p>
      <div class="st-body">
        <p>Butterfly Trails is an interactive archive of family stories, drawn on a canvas, and it needs JavaScript to draw itself. Nothing is loaded from a network — the trail, the memories and the flight paths are all computed in the browser.</p>
        <p>Every family is the result of thousands of improbable moments. This room follows the small ones: the decisions, coincidences and near-misses that redirected everything after them. Two lives run alongside each other, become one, and divide again each time somebody is born; every story is a point somewhere on that braid.</p>
        <p>The name comes from Edward Lorenz, who in 1961 typed a weather figure to three decimal places instead of six and watched the forecast turn into a different world — and, for most people, from the 2004 film with Ashton Kutcher.</p>
        <p>The archive is still being collected. Stories coming soon. Before the finite.</p>
        <p><a href="index.html">Return to the foyer →</a> · <a href="studio.html">the studio →</a></p>
      </div>
    </div>
  </div>
</noscript>
