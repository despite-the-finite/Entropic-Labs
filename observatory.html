<title>Observatory — Entropic Labs</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04030B">
<meta name="description" content="The Observatory at Entropic Labs — a map of things worth wondering about. An interactive star chart of science, deep time, lost civilizations, animal minds and unresolved questions.">
<link rel="stylesheet" href="observatory/observatory.css">
<!--
  The Observatory is one responsive page, not a desktop page with an m/ twin.
  The other pages are prose, so a hand-tuned mobile copy is cheap and worth
  it; this one is a canvas app whose layout is computed at runtime from the
  viewport and the pointer type, and a second copy would only ever drift.
  Both the full site and m/ link straight here, and because this page carries
  no redirect script it is safe to enter from either.
-->

<canvas id="sky" aria-hidden="true"></canvas>
<div class="glass" aria-hidden="true"></div>

<nav class="obs-nav">
  <a class="brand" href="index.html">ENTROPIC<span>·</span>LABS</a>
  <ul class="navlinks">
    <li><a href="studio.html">Studio</a></li>
    <li><a href="games.html">Games</a></li>
    <li><a href="observatory.html" aria-current="page">Observatory</a></li>
    <li><a href="butterfly.html">Butterfly Trails</a></li>
    <li class="nav-exit"><a href="index.html">← Labs</a></li>
  </ul>
</nav>

<div class="plate">
  <h1>Entropic Labs <span class="slash">//</span> Observatory</h1>
  <p class="sub">A map of things worth wondering about.</p>
  <p class="hint">Ten fields catalogued · Select a star</p>
</div>

<details class="status" id="status">
  <summary>
    <span class="sum-left"><span class="lamp" aria-hidden="true"></span> Observatory status</span>
    <span class="status-time" id="status-clock">--:--:--</span>
    <span class="caret" aria-hidden="true"></span>
  </summary>
  <div class="status-body" id="status-body"></div>
</details>

<div class="readout" aria-hidden="true">
  <div class="coords" id="coords"></div>
  <div class="syslog" id="syslog"></div>
</div>

<div class="actions">
  <button class="obs-btn" id="observe" type="button">
    <span class="dot" aria-hidden="true"></span> Observe something
  </button>
  <button class="obs-btn ghost" id="back-field" type="button" hidden>Return to field</button>
</div>

<div class="panel catalog" id="catalog" role="region" aria-label="Field catalogue" hidden></div>
<article class="panel record" id="record" role="region" aria-label="Observation record" hidden></article>

<nav class="keynav" id="keynav" aria-label="Observatory index"></nav>

<noscript>
  <div class="panel record" style="position:static;height:auto;border-left:2px solid var(--signal);margin:5rem auto;max-width:44rem">
    <div class="record-inner" style="padding-top:2rem">
      <h2 class="rec-title">The Observatory</h2>
      <div class="rec-body">
        <p>The Observatory is an interactive star chart, and it needs JavaScript to draw itself. It catalogues observations across ten fields: the universe, human origins, lost civilizations, life, deep time, animal intelligence, quantum reality, Earth, technology, and the unknown.</p>
        <p>Nothing is loaded from a network — the chart, the records and the status readings are all computed in the browser. With scripting enabled, this page becomes the map.</p>
        <p><a href="index.html" style="color:var(--trace)">Return to the foyer →</a> · <a href="studio.html" style="color:var(--trace)">the studio →</a></p>
      </div>
    </div>
  </div>
</noscript>

<script src="observatory/data/observations.js"></script>
<script src="observatory/telemetry.js"></script>
<script src="observatory/starfield.js"></script>
<script src="observatory/observatory.js"></script>
